<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapvida Cotação - Pro</title>
    <link rel="icon" type="image/png" href="icone-192.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --glass: rgba(255,255,255,0.52);
            --glass-border: rgba(255,255,255,0.78);
            --glass-shadow: rgba(50,130,200,0.18);
            --text-dark: #1a4a6e;
            --text-mid: #2d6a9f;
            --text-light: #62a0c8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #74d7ff 0%, #2e9fd8 40%, #1a7bbf 100%);
            background-attachment: fixed;
            padding: 36px 16px 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180,235,255,0.45) 0%, transparent 70%);
            top: -150px; left: -150px;
            pointer-events: none; z-index: 0;
            animation: blob1 14s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            width: 450px; height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            bottom: -100px; right: -80px;
            pointer-events: none; z-index: 0;
            animation: blob2 17s ease-in-out infinite alternate;
        }
        @keyframes blob1 { to { transform: translate(70px, 50px) scale(1.2); } }
        @keyframes blob2 { to { transform: translate(-60px, -40px) scale(1.15); } }

        .page-wrap {
            position: relative; z-index: 1;
            width: 100%; max-width: 1080px;
        }

        /* HEADER */
        .site-header { text-align: center; margin-bottom: 30px; }
        .site-header h1 {
            font-size: 2rem; font-weight: 900;
            color: white;
            text-shadow: 0 2px 16px rgba(20,80,150,0.4);
            letter-spacing: -0.5px;
        }
        .site-header p {
            margin-top: 6px; font-size: 1rem; font-weight: 600;
            color: rgba(255,255,255,0.85);
        }

        /* GLASS CARD */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border: 1.5px solid var(--glass-border);
            border-radius: 22px;
            box-shadow:
                0 8px 36px var(--glass-shadow),
                0 1.5px 0 rgba(255,255,255,0.75) inset,
                0 -1px 0 rgba(100,180,230,0.15) inset;
        }

        /* LAYOUT */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }
        @media (max-width: 780px) {
            .grid-2 { grid-template-columns: 1fr; }
            .site-header h1 { font-size: 1.5rem; }
        }

        /* SECTION HEADER */
        .card-header {
            display: flex; align-items: center; gap: 8px;
            padding: 15px 20px;
            border-bottom: 1.5px solid rgba(255,255,255,0.65);
            font-size: 0.72rem; font-weight: 800;
            letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--text-mid);
        }
        .card-header .pip {
            width: 9px; height: 9px; border-radius: 50%;
            background: linear-gradient(135deg, #3a8fd4, #1a5fa8);
            box-shadow: 0 0 8px rgba(58,143,212,0.7);
            flex-shrink: 0;
        }
        .pip-green {
            background: linear-gradient(135deg, #5dd45d, #3db33d) !important;
            box-shadow: 0 0 8px rgba(93,212,93,0.7) !important;
        }

        /* FORM */
        .form-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .field-label {
            display: block; font-size: 0.88rem; font-weight: 800;
            color: var(--text-dark); margin-bottom: 9px;
        }

        /* Radio pills */
        .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .radio-pill { flex: 1; min-width: 95px; }
        .radio-pill input[type=radio] { display: none; }
        .radio-pill label {
            display: flex; align-items: center; justify-content: center;
            padding: 9px 10px; border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.38);
            cursor: pointer; font-size: 0.83rem; font-weight: 700;
            color: var(--text-mid); transition: all 0.2s; text-align: center;
        }
        .radio-pill input:checked + label {
            background: linear-gradient(135deg, #3a8fd4, #1a5fa8);
            border-color: rgba(26,95,168,0.8); color: white;
            box-shadow: 0 4px 16px rgba(26,95,168,0.45);
        }
        .radio-pill label:hover { background: rgba(255,255,255,0.62); }

        /* Text inputs */
        .text-input {
            width: 100%; padding: 11px 14px;
            border-radius: 13px;
            border: 2px solid rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.5);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem; font-weight: 700; color: var(--text-dark);
            outline: none; transition: border 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .text-input::placeholder { color: var(--text-light); font-weight: 600; }
        .text-input:focus {
            border-color: rgba(58,143,212,0.9);
            box-shadow: 0 0 0 3px rgba(58,143,212,0.2);
            background: rgba(255,255,255,0.72);
        }
        select.text-input { appearance: none; cursor: pointer; }

        .grid-2-sm { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Checkboxes */
        .check-group { display: flex; flex-wrap: wrap; gap: 9px; }
        .check-pill input[type=checkbox] { display: none; }
        .check-pill label {
            display: flex; align-items: center; gap: 7px;
            padding: 8px 15px; border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.38);
            cursor: pointer; font-size: 0.83rem; font-weight: 700;
            color: var(--text-mid); transition: all 0.2s; user-select: none;
        }
        .check-pill input:checked + label {
            background: linear-gradient(135deg, #5dd45d, #3db33d);
            border-color: rgba(61,179,61,0.8); color: white;
            box-shadow: 0 4px 14px rgba(61,179,61,0.38);
        }
        .check-pill label:hover { background: rgba(255,255,255,0.62); }
        .chk-icon { font-size: 13px; }

        /* Generate button */
        .btn-main {
            width: 100%; padding: 13px 20px;
            border-radius: 50px; border: none;
            background: linear-gradient(135deg, #3a8fd4 0%, #1a5fa8 100%);
            color: white; font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 800; cursor: pointer;
            letter-spacing: 0.6px; text-transform: uppercase;
            box-shadow: 0 6px 22px rgba(26,95,168,0.5), 0 1px 0 rgba(255,255,255,0.3) inset;
            transition: all 0.22s;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(26,95,168,0.6); }
        .btn-main:active { transform: translateY(0); }

        /* RESULT card header */
        .result-header {
            display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 10px;
            padding: 13px 18px;
            border-bottom: 1.5px solid rgba(255,255,255,0.65);
        }
        .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }

        .btn-sm {
            display: flex; align-items: center; gap: 5px;
            padding: 8px 15px; border-radius: 50px; border: none;
            font-family: 'Nunito', sans-serif; font-size: 0.8rem; font-weight: 800;
            cursor: pointer; letter-spacing: 0.3px; text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }
        .btn-sm:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.22); }
        .btn-copy { background: linear-gradient(135deg, #5dd45d, #3db33d); color: white; }
        .btn-pdf  { background: linear-gradient(135deg, #e05555, #c03838); color: white; }
        .btn-wa   { background: linear-gradient(135deg, #25D366, #1aaa52); color: white; }

        textarea#resultadoArea {
            width: 100%; height: 450px;
            background: transparent; border: none; outline: none; resize: none;
            font-family: 'Nunito', monospace;
            font-size: 0.92rem; font-weight: 600;
            color: var(--text-dark); line-height: 1.7;
            padding: 18px 22px;
        }
        textarea#resultadoArea::placeholder { color: var(--text-light); }

        /* PDF MODAL */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: fixed; top: 0; left: 0; width: 100%; background: white; }
        }

        #pdfModal {
            display: none; position: fixed; inset: 0;
            background: rgba(10,50,100,0.55);
            backdrop-filter: blur(5px);
            z-index: 1000; align-items: center; justify-content: center;
        }
        #pdfModal.open { display: flex; }
        #pdfModalContent {
            background: white; border-radius: 20px;
            width: 92%; max-width: 640px; max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 24px 70px rgba(10,50,120,0.45);
            display: flex; flex-direction: column;
        }
        .modal-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; border-bottom: 1px solid #e5e7eb;
            background: #f9fafb; border-radius: 20px 20px 0 0;
            position: sticky; top: 0;
        }
        .modal-title { font-size: 0.78rem; font-weight: 800; color: #374151; text-transform: uppercase; letter-spacing: 0.8px; }
        .modal-btns { display: flex; gap: 8px; }
        .mbtn {
            border: none; border-radius: 50px; padding: 8px 16px;
            font-family: 'Nunito', sans-serif; font-size: 0.78rem; font-weight: 800;
            cursor: pointer; transition: all 0.2s;
        }
        .mbtn-save { background: linear-gradient(135deg, #e05555, #c03838); color: white; box-shadow: 0 3px 12px rgba(192,56,56,0.35); }
        .mbtn-close { background: #e5e7eb; color: #374151; }
        #printArea { padding: 28px; }
    </style>
</head>

<div class="page-wrap">

    <div class="site-header">
        <h1>🏥 Hapvida — Individual · SUPER SIMPLES · SISPEAM</h1>
        <p>desenvolvido por narry :D</p>
    </div>

    <div class="grid-2">

        <!-- FORM -->
        <div class="glass-card">
            <div class="card-header">
                <span class="pip"></span>
                Configurar Cotação
            </div>
            <div class="form-body">

                <div>
                    <span class="field-label">Tipo de Contrato</span>
                    <div class="radio-group">
                        <div class="radio-pill">
                            <input type="radio" name="tipoContrato" id="r1" value="INDIVIDUAL" checked onchange="atualizarPlanos()">
                            <label for="r1">Individual</label>
                        </div>
                        <div class="radio-pill">
                            <input type="radio" name="tipoContrato" id="r2" value="SUPER SIMPLES" onchange="atualizarPlanos()">
                            <label for="r2">Super Simples</label>
                        </div>
                        <div class="radio-pill">
                            <input type="radio" name="tipoContrato" id="r3" value="SISPEAM MANAUS" onchange="atualizarPlanos()">
                            <label for="r3">SISPEAM Manaus</label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="field-label" for="idadesInput">Idades (separadas por vírgula)</label>
                    <input type="text" id="idadesInput" class="text-input" placeholder="Ex: 5, 28, 42, 60">
                </div>

                <div class="grid-2-sm">
                    <div>
                        <label class="field-label" for="nomePlano">Linha do Plano</label>
                        <select id="nomePlano" class="text-input"></select>
                    </div>
                    <div>
                        <label class="field-label" for="copart">Coparticipação</label>
                        <select id="copart" class="text-input">
                            <option value="PARCIAL">Parcial</option>
                            <option value="TOTAL">Total</option>
                        </select>
                    </div>
                </div>

                <div>
                    <span class="field-label">Acomodações</span>
                    <div class="check-group">
                        <div class="check-pill">
                            <input type="checkbox" id="checkAmb" checked>
                            <label for="checkAmb"><span class="chk-icon">🏃</span> Ambulatorial</label>
                        </div>
                        <div class="check-pill">
                            <input type="checkbox" id="checkEnf" checked>
                            <label for="checkEnf"><span class="chk-icon">🛏️</span> Enfermaria</label>
                        </div>
                        <div class="check-pill">
                            <input type="checkbox" id="checkApt">
                            <label for="checkApt"><span class="chk-icon">🌟</span> Apartamento</label>
                        </div>
                    </div>
                </div>

                <button class="btn-main" onclick="gerarOrcamento()">✨ Gerar Orçamento</button>
            </div>
        </div>

        <!-- RESULT -->
        <div class="glass-card" style="display:flex;flex-direction:column;">
            <div class="result-header">
                <div class="card-header" style="padding:0;border:none;">
                    <span class="pip pip-green"></span>
                    Resultado
                </div>
                <div class="btn-row">
                    <button class="btn-sm btn-copy" id="btnCopiar" onclick="copiarTexto()">📋 Copiar</button>
                    <button class="btn-sm btn-pdf" onclick="abrirPdf()">📄 PDF</button>
                    <button class="btn-sm btn-wa" onclick="compartilharWhatsApp()">💬 WhatsApp</button>
                </div>
            </div>
            <textarea id="resultadoArea" readonly placeholder="Configure e clique em Gerar Orçamento para ver o resultado aqui..."></textarea>
        </div>

    </div>
</div>

<!-- PDF MODAL -->
<div id="pdfModal">
    <div id="pdfModalContent">
        <div class="modal-top">
            <span class="modal-title">📄 Pré-visualização da Cotação</span>
            <div class="modal-btns">
                <button class="mbtn mbtn-save" onclick="imprimirPdf()">📥 Salvar PDF</button>
                <button class="mbtn mbtn-close" onclick="fecharModal()">✕ Fechar</button>
            </div>
        </div>
        <div id="printArea"></div>
    </div>
</div>

const planosPorTipo = {
    "INDIVIDUAL":     ["NOSSO PLANO", "NOSSO MÉDICO"],
    "SUPER SIMPLES":  ["NOSSO PLANO", "NOSSO MÉDICO"],
    "SISPEAM MANAUS": ["AFFIX MANAUS"]
};

function atualizarPlanos() {
    const tipo = document.querySelector('input[name="tipoContrato"]:checked').value;
    const sel = document.getElementById('nomePlano');
    sel.innerHTML = '';
    planosPorTipo[tipo].forEach(p => {
        const o = document.createElement('option');
        o.value = p; o.textContent = p;
        sel.appendChild(o);
    });
}
atualizarPlanos();

function getFaixa(idade) {
    idade = parseInt(idade);
    if (idade <= 18) return { t: "00 a 18", k: "0-18" };
    if (idade <= 23) return { t: "19 a 23", k: "19-23" };
    if (idade <= 28) return { t: "24 a 28", k: "24-28" };
    if (idade <= 33) return { t: "29 a 33", k: "29-33" };
    if (idade <= 38) return { t: "34 a 38", k: "34-38" };
    if (idade <= 43) return { t: "39 a 43", k: "39-43" };
    if (idade <= 48) return { t: "44 a 48", k: "44-48" };
    if (idade <= 53) return { t: "49 a 53", k: "49-53" };
    if (idade <= 58) return { t: "54 a 58", k: "54-58" };
    return { t: "59 ou +", k: "59+" };
}

const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
let ultimoResultado = {};

function gerarOrcamento() {
    const tipo   = document.querySelector('input[name="tipoContrato"]:checked').value;
    const plano  = document.getElementById('nomePlano').value;
    const copart = document.getElementById('copart').value;
    const idades = document.getElementById('idadesInput').value
                    .split(/[\s,]+/).map(i => i.trim()).filter(i => i !== "");
    if (!idades.length) { alert("Insira as idades."); return; }

    const querAmb = document.getElementById('checkAmb').checked;
    const querEnf = document.getElementById('checkEnf').checked;
    const querApt = document.getElementById('checkApt').checked;

    let texto = `HAPVIDA - ${tipo}\nPLANO: ${plano} | COPART: ${copart}\n------------------------------------\n\n`;
    let somaAmb = 0, somaEnf = 0, somaApt = 0;
    const itens = [];

    idades.forEach(idade => {
        const info   = getFaixa(idade);
        const precos = tabelaPrecos[tipo]?.[plano]?.[copart]?.[info.k];
        if (!precos) { texto += `Beneficiário: ${idade} anos — dados não encontrados.\n\n`; return; }

        texto += `Beneficiário: ${idade} anos (${info.t} anos)\n`;
        const benefItem = { idade, faixa: info.t, linhas: [] };

        const processar = (label, valorBase, key) => {
            const vDesc = (tipo === "SISPEAM MANAUS" && precos[key+"15"] !== undefined)
                ? precos[key+"15"] : valorBase * 0.85;
            texto += `* ${label}: ${fmt(vDesc)} (durante 3 meses) -> \n`;
            texto += `Após os 3 meses - ${fmt(valorBase)}\n`;
            benefItem.linhas.push({ label, vDesc, valorBase });
            return vDesc;
        };

        if (querAmb && precos.amb !== undefined) somaAmb += processar("Ambulatorial", precos.amb, "amb");
        if (querEnf && precos.enf !== undefined) somaEnf += processar("Enfermaria",   precos.enf, "enf");
        if (querApt && precos.apt !== undefined) somaApt += processar("Apartamento",  precos.apt, "apt");

        itens.push(benefItem);
        texto += '\n';
    });

    texto += `------------------------------------\nRESUMO DO GRUPO (${idades.length} vida${idades.length > 1 ? 's' : ''}):\n`;
    if (querAmb && somaAmb > 0) texto += `TOTAL AMBULATORIAL: ${fmt(somaAmb)}\n`;
    if (querEnf && somaEnf > 0) texto += `TOTAL ENFERMARIA: ${fmt(somaEnf)}\n`;
    if (querApt && somaApt > 0) texto += `TOTAL APARTAMENTO: ${fmt(somaApt)}\n`;

    document.getElementById('resultadoArea').value = texto.trim();
    ultimoResultado = { texto: texto.trim(), tipo, plano, copart, idades, itens, somaAmb, somaEnf, somaApt, querAmb, querEnf, querApt };
}

function copiarTexto() {
    const val = document.getElementById('resultadoArea').value;
    if (!val) { alert("Gere o orçamento primeiro."); return; }
    navigator.clipboard.writeText(val).then(() => {
        const btn = document.getElementById('btnCopiar');
        btn.textContent = '✅ Copiado!';
        setTimeout(() => btn.textContent = '📋 Copiar', 2000);
    });
}

function compartilharWhatsApp() {
    const val = document.getElementById('resultadoArea').value;
    if (!val) { alert("Gere o orçamento primeiro."); return; }
    window.open(`https://wa.me/?text=${encodeURIComponent(val)}`, '_blank');
}

                        <th style="padding:6px 12px;font-size:10px;text-align:right;color:#6b7280;font-weight:700;text-transform:uppercase;">Valor Normal</th>
                    </tr></thead>
                    <tbody>${linhas}</tbody>
                </table>
            </div>`;
    }).join('');

    let resumo = '';
    if (querAmb && somaAmb > 0) resumo += `<tr><td style="padding:8px 12px;font-size:13px;color:#374151;">Total Ambulatorial</td><td style="padding:8px 12px;font-size:14px;font-weight:800;text-align:right;color:#1d4ed8;">${fmt(somaAmb)}</td></tr>`;
    if (querEnf && somaEnf > 0) resumo += `<tr><td style="padding:8px 12px;font-size:13px;color:#374151;">Total Enfermaria</td><td style="padding:8px 12px;font-size:14px;font-weight:800;text-align:right;color:#1d4ed8;">${fmt(somaEnf)}</td></tr>`;
    if (querApt && somaApt > 0) resumo += `<tr><td style="padding:8px 12px;font-size:13px;color:#374151;">Total Apartamento</td><td style="padding:8px 12px;font-size:14px;font-weight:800;text-align:right;color:#1d4ed8;">${fmt(somaApt)}</td></tr>`;

    document.getElementById('printArea').innerHTML = `
        <div style="font-family:'Nunito',sans-serif;max-width:560px;margin:0 auto;">
            <div style="background:linear-gradient(135deg,#1a7bbf,#74d7ff);border-radius:14px;padding:24px;margin-bottom:18px;color:white;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
                    <div>
                        <div style="font-size:22px;font-weight:900;letter-spacing:-0.5px;">🏥 HAPVIDA</div>
                        <div style="font-size:12px;opacity:0.85;margin-top:2px;">Cotação de Plano de Saúde</div>
                    </div>
                    <div style="text-align:right;font-size:11px;opacity:0.85;"><div>📅 ${hoje}</div><div>👥 ${idades.length} vida${idades.length>1?'s':''}</div></div>
                </div>
                <div style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.3);display:flex;gap:20px;flex-wrap:wrap;">
                    <div><div style="font-size:10px;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px;">Tipo</div><div style="font-size:13px;font-weight:700;">${tipo}</div></div>
                    <div><div style="font-size:10px;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px;">Plano</div><div style="font-size:13px;font-weight:700;">${plano}</div></div>
                    <div><div style="font-size:10px;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px;">Coparticipação</div><div style="font-size:13px;font-weight:700;">${copart}</div></div>
                </div>
            </div>
            <div style="background:#fefce8;border:1px solid #fde047;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#713f12;">
                <strong>⭐ Desconto promocional:</strong> Valores com desconto válidos pelos <strong>3 primeiros meses</strong>. Após esse período aplica-se o valor normal.
            </div>
            ${benefHTML}
            <div style="border:2px solid #1d4ed8;border-radius:12px;overflow:hidden;margin-top:8px;">
                <div style="background:linear-gradient(135deg,#1d4ed8,#2563eb);padding:10px 14px;">
                    <span style="color:white;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;">📊 Resumo do Grupo (${idades.length} vida${idades.length>1?'s':''})</span>
                </div>
                <table style="width:100%;border-collapse:collapse;background:white;"><tbody>${resumo}</tbody></table>
            </div>
            <div style="margin-top:20px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:10px;color:#9ca3af;text-align:center;">
                Cotação informativa sujeita a confirmação — Gerada em ${hoje}
            </div>
        </div>`;

    document.getElementById('pdfModal').classList.add('open');
}

function fecharModal() { document.getElementById('pdfModal').classList.remove('open'); }
function imprimirPdf() { window.print(); }
document.getElementById('pdfModal').addEventListener('click', function(e) { if (e.target === this) fecharModal(); });
